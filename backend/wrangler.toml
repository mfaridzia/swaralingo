name = "swaralingo-api"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = [ "nodejs_compat" ]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
NODE_ENV = "production"
# Masukkan detail Turso di Cloudflare Workers Dashboard / environment variables saat deploy
# TURSO_DATABASE_URL = "libsql://your-db-name-user.turso.io"
# TURSO_AUTH_TOKEN = "your-turso-auth-token"
# GEMINI_API_KEY = "your-gemini-api-key"

# Bucket R2 untuk penyimpanan audio rekaman (buat sekali: wrangler r2 bucket create swaralingo-audio)
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "swaralingo-audio"

# Workers AI — transkripsi suara Whisper gratis (fallback Gemini untuk bun dev lokal)
[ai]
binding = "AI"
